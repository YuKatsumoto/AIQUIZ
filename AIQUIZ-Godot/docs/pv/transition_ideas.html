<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV 場面転換の案</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1d1d1b;--sub:#5f5e5a;--line:#d3d1c7;--accent:#185fa5;--accent-bg:#e6f1fb}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--card:#262624;--text:#f1efe8;--sub:#b4b2a9;--line:#444441;--accent:#85b7eb;--accent-bg:#0c447c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.7}
main{max-width:880px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
p.lead{color:var(--sub);margin:0 0 16px;font-size:14px}
#btns{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
#btns button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
#btns button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
canvas{width:100%;height:auto;border-radius:12px;display:block;background:#000}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--sub)}
.info{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px}
.info dt{color:var(--sub);font-size:12px}
.info dd{margin:0 0 8px}
</style>
</head>
<body>
<main>
<h1>PV 場面転換の案</h1>
<p class="lead">ボタンで案を切り替えると、「前のカット → 次のカット」の転換を繰り返し再生します（色の板だけの仮の絵です）。</p>
<div id="btns"></div>
<canvas id="cv" width="640" height="360"></canvas>
<div class="row"><span id="cap"></span><span><label>線の色 <select id="pal"><option value="video">動画と同じ（クリーム・青・黄）</option><option value="game">TESTOPIA の色（白・黄・青）</option></select></label>　<label><input type="checkbox" id="slow"> スロー（0.4倍）</label></span></div>
<dl class="info">
<dt>向くつなぎ</dt><dd id="where"></dd>
<dt>AEでの作り方の目安</dt><dd id="how"></dd>
<dt>ゲームとのつながり</dt><dd id="game"></dd>
</dl>
</main>
<script>
const W=640,H=360,cv=document.getElementById('cv'),c=cv.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t,ei=t=>t*t*t,eo=t=>1-Math.pow(1-t,3),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function rnd(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function scene(bg,fl,lab,sub){const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,W,H);x.fillStyle=fl;x.fillRect(0,H*.68,W,H);x.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<9;i++)x.fillRect(i*80-10,H*.68,40,H);x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.font='500 64px sans-serif';x.fillText(lab,W/2,H*.36);x.font='400 22px sans-serif';x.fillText(sub,W/2,H*.36+54);return o}
const A=scene('#2b4f8c','#1b3260','前のカット','S07 など');
const B=scene('#d9832b','#8a4a12','次のカット','S09 など');
const WALL=(()=>{const o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');x.fillStyle='#e9e4d8';x.fillRect(0,0,W,H);x.strokeStyle='#c9c1ad';x.lineWidth=3;for(let r=0;r<H;r+=40){x.beginPath();x.moveTo(0,r);x.lineTo(W,r);x.stroke();for(let k=(r/40)%2*40;k<W;k+=80){x.beginPath();x.moveTo(k,r);x.lineTo(k,r+40);x.stroke()}}const dw=150,dh=210,g=50,x0=(W-(dw*3+g*2))/2;['#e5484d','#3e8ee8','#36b37e'].forEach((col,i)=>{const dx=x0+i*(dw+g);x.fillStyle=col;x.fillRect(dx,H-dh-24,dw,dh);x.fillStyle='#fff';x.font='500 90px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('?',dx+dw/2,H-dh/2-24)});return o})();
function shards(img,t,seed,cx,cy){const R=rnd(seed),nx=10,ny=6,pw=W/nx,ph=H/ny;for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const px=i*pw,py=j*ph,mx=px+pw/2-cx,my=py+ph/2-cy,d=Math.hypot(mx,my)+1,sp=(260+R()*420)*(1.3-d/700),vx=mx/d*sp,vy=my/d*sp-160*R(),rot=(R()-.5)*8,del=R()*.08,tt=Math.max(0,t-del);c.save();c.translate(px+pw/2+vx*tt,py+ph/2+vy*tt+700*tt*tt);c.rotate(rot*tt);const s=1+tt*.5;c.scale(s,s);c.globalAlpha=cl(1-tt*1.2);c.drawImage(img,px,py,pw,ph,-pw/2,-ph/2,pw,ph);c.restore()}c.globalAlpha=1}
function bandAt(x){const k=H*.38;c.fillStyle='#ffd23c';c.beginPath();c.moveTo(x,-10);c.lineTo(x+W*1.7,-10);c.lineTo(x+W*1.7-k,H+10);c.lineTo(x-k,H+10);c.fill();c.fillStyle='#fff';c.beginPath();c.moveTo(x-34,-10);c.lineTo(x-10,-10);c.lineTo(x-10-k,H+10);c.lineTo(x-34-k,H+10);c.fill()}
const GB=(()=>{const R=rnd(7),a=[];for(let i=0;i<110;i++){const w=20+R()*220,h=8+R()*70;a.push([R()*W-w/2,R()*H-h/2,w,h,.08+R()*.75])}return a})();
// 線のトランジション：太い線（線端は丸）5 本をパスのトリミングで伸ばして覆い、後ろ端を色ごとにずらして抜く
const PAL={video:['#fdfbf3','#1666f0','#fdbd3c'],game:['#fff7e0','#ffd23c','#2e5c9e']};
const LS=H*.207,LWD=LS*1.04,X0=-LWD/2-4,X1=W+LWD/2+4;
const OLD=document.createElement('canvas');OLD.width=W;OLD.height=H;const ox=OLD.getContext('2d');
// イーズは動画の計測から当てはめたベジェ（伸ばす：0.7, 0, 0.2, 1／抜く：0.55, 0, 0.35, 1）
function bez(x1,x2){return s=>{if(s<=0)return 0;if(s>=1)return 1;let lo=0,hi=1,u=.5;for(let i=0;i<24;i++){u=(lo+hi)/2;if(3*(1-u)*(1-u)*u*x1+3*(1-u)*u*u*x2+u*u*u<s)lo=u;else hi=u}return 3*(1-u)*u*u+u*u*u}}
const EH=bez(.7,.2),ET=bez(.55,.35);
const pr=(t,s,d,e)=>e(cl((t-s)/d)),at=u=>lp(X0,X1,u);
function seg(x,a,b,y,w,col){if(b<=a)return;x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(a,y);x.lineTo(b,y);x.stroke()}
const EX=(()=>{const R=rnd(31),a=[];for(let i=0;i<14;i++){const s=R()*.3;a.push({y:H*(.04+R()*.92),w:LWD*[.12,.18,.42][Math.floor(R()*3)],c:1+Math.floor(R()*2),s,d:.3+R()*.12,ts:s+.18+R()*.3,td:.25+R()*.1})}return a})();
function lines(t,kf,extra){const P=PAL[document.getElementById('pal').value],L=[];
for(let i=0;i<5;i++){const k=kf(i);L.push({y:H/2+(i-2)*LS,h:at(pr(t,.07*k,.55,EH)),tc:at(pr(t,.37+.06*k,.45,ET)),tb:at(pr(t,.42+.06*k,.45,ET)),ty:at(pr(t,.47+.06*k,.45,ET))})}
c.drawImage(B,0,0);ox.globalCompositeOperation='source-over';ox.drawImage(A,0,0);ox.globalCompositeOperation='destination-out';L.forEach(l=>seg(ox,-W,l.h,l.y,LWD,'#000'));ox.globalCompositeOperation='source-over';c.drawImage(OLD,0,0);
L.forEach(l=>{seg(c,l.ty,l.h,l.y,LWD,P[2]);seg(c,l.tb,l.h,l.y,LWD,P[1]);seg(c,l.tc,l.h,l.y,LWD,P[0])});
if(extra)EX.forEach(e=>seg(c,at(pr(t,e.ts,e.td,ET)),at(pr(t,e.s,e.d,EH)),e.y,e.w,P[e.c]))}
const LINE_HOW='シェイプレイヤーの線（線端：丸型、線幅＝画面の高さの約 1/5）を 5 本。パスのトリミングの「終了」を 0.55 秒で伸ばして覆い、「開始」を 0.45 秒で抜く。同じ線を色違いで 3 枚重ね（上からクリーム・青・黄）、「開始」だけ 0.05 秒ずつ遅らせる。速度グラフの影響は、伸ばすとき 70%→80%、抜くとき 55%→65%';
const TR=[
{n:'今：黄色い帯',w:'今のつなぎ（S03→S04・S05→S06）',how:'build_master.jsx の wipeIn / wipeOut（右から覆い、左へ抜ける）',game:'S03 のロゴのベルトから続く黄色い帯',d:.9,f(p){if(p<.5){c.drawImage(A,0,0);bandAt(lp(W+H*.38+40,-2,ei(p*2)))}else{c.drawImage(B,0,0);bandAt(lp(-2,-W*1.7-40,eo((p-.5)*2)))}}},
{n:'線A：動画の再現',w:'黄色い帯の代わり（S03→S04・S05→S06）、または章の区切り',how:LINE_HOW+'。真ん中の線が先に出て、外側へ 0.07 秒ずつ遅らせる（抜くときは 0.06 秒ずつ）。全体で約 1.05 秒',game:'「覆って→抜ける」は黄色い帯と同じ。TESTOPIA の色にすると S03 の帯とそろう',d:1.05,f(p){lines(p*1.05,i=>Math.abs(i-2),false)}},
{n:'線B：斜め',w:'黄色い帯の代わり（右上→左下の流れを出したいとき）',how:LINE_HOW+'。遅らせ方を上の線から順にする（階段状）',game:'S03 の帯の斜めの向きに近い',d:1.05,f(p){lines(p*1.05,i=>i*.5,false)}},
{n:'線C：細い線を足す',w:'にぎやかにしたい区切り（S07→S09 など）',how:LINE_HOW+'。細い線（太さ 1/8〜2/5）を十数本、ばらばらのタイミングで重ねる',game:'—',d:1.15,f(p){lines(p*1.15,i=>Math.abs(i-2),true)}},
{n:'扉ブレイク',w:'S02→S03（P1 が「56」を突き破った勢いのままタイトルへ）',how:'前のカットの最後のコマを CC Shatter で割るか、格子に切った破片を飛ばす',game:'扉を突き破る、ゲームの一番の見せ場と同じ動き',d:1.1,f(p){c.drawImage(B,0,0);if(p<.15){const s=Math.sin(p*120)*6;c.drawImage(A,s,0);c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();const R=rnd(3);for(let i=0;i<7;i++){c.moveTo(W/2,H/2);c.lineTo(W/2+(R()-.5)*W*p*7,H/2+(R()-.5)*H*p*7)}c.stroke()}else shards(A,(p-.15)/.85*.9,11,W/2,H/2)}},
{n:'正解の○アイリス',w:'S09→S21（ゴールして結果発表へ）',how:'円のトラックマットに、赤い輪のシェイプを重ねる',game:'クイズの「正解」の印',d:1.2,f(p){const M=Math.hypot(W,H)/2+30;let img,r;if(p<.45){img=A;r=lp(M,0,ei(p/.45))}else if(p<.55){img=A;r=0}else{img=B;r=lp(0,M,eo((p-.55)/.45))}c.drawImage(img,0,0);c.fillStyle='#0b0b14';c.beginPath();c.rect(0,0,W,H);c.arc(W/2,H/2,Math.max(r,.01),0,Math.PI*2,true);c.fill();if(r>2){c.strokeStyle='#e5484d';c.lineWidth=Math.min(24,r*.3);c.beginPath();c.arc(W/2,H/2,r,0,Math.PI*2);c.stroke()}}},
{n:'ハーフトーン',w:'S21→S20',how:'ドットのマットをグラデーションワイプで動かす',game:'SceneTransition のハーフトーンワイプと同じ柄にできる',d:1.1,f(p){const s=26,cols=Math.ceil(W/s)+2,rows=Math.ceil(H/s)+2,ph=p<.5?p*2:(p-.5)*2;c.drawImage(p<.5?A:B,0,0);c.fillStyle='#1d2a4a';for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const d=i/cols*.7+(1-j/rows)*.3,v=cl((ph*1.7-d)*2.2),k=p<.5?v:1-v,r=k*s*.78;if(r>.3){c.beginPath();c.arc(i*s+(j%2)*s/2-s/2,j*s,r,0,7);c.fill()}}}},
{n:'左右ドア',w:'S04→S05（メニューからヘリへ）',how:'青い四角 2 枚の位置キーだけ',game:'SceneTransition の change_scene_doors（ACCENT_BLUE）',d:1.1,f(p){let o;if(p<.42){c.drawImage(A,0,0);o=ei(p/.42)}else if(p<.58){c.drawImage(A,0,0);o=1}else{c.drawImage(B,0,0);o=1-eo((p-.58)/.42)}const w=W/2*o;c.fillStyle='#2e5c9e';c.fillRect(0,0,w,H);c.fillRect(W-w,0,w,H);c.fillStyle='#9ec3ff';c.fillRect(w-6,0,6,H);c.fillRect(W-w,0,6,H);c.fillStyle='rgba(255,255,255,.18)';c.fillRect(w-W*.32,H*.2,W*.2,H*.6);c.fillRect(W-w+W*.12,H*.2,W*.2,H*.6)}},
{n:'VSスプリット',w:'S07→S09（2 人の対戦が始まる）',how:'前のカットを複製して斜めのマスクで 2 つに割り、火花を足す',game:'オンライン対戦のカットイン（hold_versus_split）。P1 オレンジ・P2 水色',d:1.2,f(p){const x1=W*.6,x2=W*.4;c.drawImage(B,0,0);if(p<.25){c.drawImage(A,0,0);const t=eo(p/.25);c.strokeStyle='#fff';c.lineWidth=6;c.beginPath();c.moveTo(x1,0);c.lineTo(lp(x1,x2,t),H*t);c.stroke();return}const t=eo((p-.25)/.75),nx=.94,ny=.335,d=t*W*.95;[[[[0,0],[x1,0],[x2,H],[0,H]],-1,'#ff9a40'],[[[x1,0],[W,0],[W,H],[x2,H]],1,'#59bfff']].forEach(([pg,sg,col])=>{c.save();c.translate(nx*d*sg,ny*d*sg);c.beginPath();pg.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.save();c.clip();c.drawImage(A,0,0);c.restore();c.strokeStyle=col;c.lineWidth=10;c.beginPath();c.moveTo(x1,0);c.lineTo(x2,H);c.stroke();c.restore()});if(t<.5){const R=rnd(5);c.strokeStyle='rgba(255,230,120,'+(1-t*2)+')';c.lineWidth=3;c.beginPath();for(let i=0;i<26;i++){const u=R(),sx=lp(x1,x2,u),sy=H*u,a=R()*Math.PI*2,L=(20+R()*60)*(.3+t*2);c.moveTo(sx,sy);c.lineTo(sx+Math.cos(a)*L,sy+Math.sin(a)*L)}c.stroke()}}},
{n:'パネルめくり',w:'S06→S07（5 教科×6 学年の並びへ）',how:'AE 標準の「カードワイプ」で行・列とめくる順番を決める',game:'問題パネルの見た目',d:1.3,f(p){const nx=8,ny=5,tw=W/nx,th=H/ny;c.fillStyle='#0b0b14';c.fillRect(0,0,W,H);for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const dl=(i+j)/(nx+ny-2),t=cl((p-dl*.55)/.45),img=t<.5?A:B,sx=Math.abs(Math.cos(Math.PI*t)),w=tw*sx,ins=t>0&&t<1?2:0;if(w<.5)continue;c.drawImage(img,i*tw,j*th,tw,th,i*tw+(tw-w)/2,j*th+ins,w,th-ins*2)}}},
{n:'壁が落ちてくる',w:'S20→S23（S01 の壁の落下と、PV の最初と最後をそろえる）',how:'壁の板を落とし、master_plan.json の shakes と同じ決まった揺れ → 扉ブレイクの破片で割る',game:'S01「Q1 の壁が空から落ちてくる」',d:1.5,f(p){c.fillStyle='#000';c.fillRect(0,0,W,H);if(p<.35){c.drawImage(A,0,0);c.drawImage(WALL,0,lp(-H,0,ei(p/.35)))}else if(p<.6){const k=1-(p-.35)/.25,sx=Math.sin(p*160)*14*k,sy=Math.cos(p*130)*10*k;c.drawImage(A,sx,sy);c.drawImage(WALL,sx,sy)}else{c.drawImage(B,0,0);shards(WALL,(p-.6)/.4*.9,23,W/2,H*.75)}}},
{n:'データノイズ',w:'S05→S06（「AI が問題を作る」へ）',how:'ブロックディゾルブ ＋ 横ずれのノイズ',game:'オンライン画面の出入り（TransitionKit の t_data）',d:1.2,f(p){c.drawImage(A,0,0);for(const[x,y,w,h,th]of GB){if(p>th){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.drawImage(B,0,0);c.restore()}}if(p>.86)c.drawImage(B,0,0);if(p>.06&&p<.92){const R=rnd(Math.floor(p*28)+1);for(let i=0;i<6;i++){const y=R()*H,h=4+R()*28,o=(R()-.5)*90;c.drawImage(cv,0,y,W,h,o,y,W,h)}c.fillStyle='rgba(60,255,210,.35)';for(let i=0;i<4;i++)c.fillRect(R()*W,R()*H,40+R()*200,2+R()*4)}}},
{n:'ホイップパン',w:'S09 の中の区切り（1 本目 → 2 本目など）',how:'2 つのカットを並べて横に速く動かし、モーションブラーを強めにかける',game:'—',d:.8,f(p){const t=eio(p),off=t*W,sp=Math.sin(Math.PI*p);c.fillStyle='#000';c.fillRect(0,0,W,H);const n=sp>.2?6:1;for(let k=n-1;k>=0;k--){const o=off-k*sp*22;c.globalAlpha=k?.22:1;c.drawImage(A,-o,0);c.drawImage(B,W-o,0)}c.globalAlpha=1;if(sp>.3){const R=rnd(9);c.strokeStyle='rgba(255,255,255,'+(sp-.3)+')';c.lineWidth=2;c.beginPath();for(let i=0;i<16;i++){const y=R()*H,x=R()*W,L=80+R()*220;c.moveTo(x,y);c.lineTo(x+L,y)}c.stroke()}}}
];
let cur=0,start=performance.now();
const bt=document.getElementById('btns'),cap=document.getElementById('cap'),slow=document.getElementById('slow');
function sel(i){cur=i;start=performance.now();[...bt.children].forEach((b,k)=>b.classList.toggle('on',k===i));const T=TR[i];cap.textContent=T.n;document.getElementById('where').textContent=T.w;document.getElementById('how').textContent=T.how;document.getElementById('game').textContent=T.game}
TR.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.n;b.onclick=()=>sel(i);bt.appendChild(b)});
slow.onchange=()=>{start=performance.now()};
sel(1);
function frame(now){const T=TR[cur],d=T.d*(slow.checked?2.5:1),tot=.6+d+.9;const e=((now-start)/1000)%tot;c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.clearRect(0,0,W,H);if(e<.6)c.drawImage(A,0,0);else if(e<.6+d)T.f((e-.6)/d);else c.drawImage(B,0,0);requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
